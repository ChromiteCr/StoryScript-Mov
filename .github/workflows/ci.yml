name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # ffmpeg/ffprobe for the media tests (scan, probe, posters, Range); the app itself starts without them
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - name: Unit and API tests
        run: npm test
        env:
          # the install smoke has its own step below (it builds, packs and runs npm ci),
          # kept apart from the timing-sensitive render/DB tests
          STORYSCRIPT_SMOKE: '0'
      - name: Build (web + server package)
        run: npm run build
      - name: Licenses (THIRD_PARTY_NOTICES.md must be committed up to date)
        run: |
          npm run licenses
          git diff --exit-code THIRD_PARTY_NOTICES.md
      - name: Install paths under a temporary HOME (npm pack → npx; git clone → npm ci → npm start)
        run: npx vitest run apps/server/test/smoke-install.test.ts
        env:
          STORYSCRIPT_SMOKE: '1'
      # Playwright E2E (npm run e2e / npx playwright test) is intentionally not run here:
      # playwright.config.ts drives the locally installed Google Chrome (channel "chrome",
      # no browser download), and the media steps need H.264 playback that the Chromium
      # builds on Linux runners lack. Run it on a Mac with Chrome before merging.
